trigger:

- main

pool: Default

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: echo %NODE_EXTRA_CA_CERTS%
  displayName: 'Where am I?'

- powershell: |
    $template = '{{define "M"}}{{.Path}} {{.Version}}{{end}}{{with .Module}}{{if not .Main}}{{if .Replace}}{{template "M" .Replace}}{{else}}{{template "M" .}}{{end}}{{end}}{{end}}'
    go list -f $template -compiled -deps | Select-Object -Unique | Out-File -FilePath go.list -Encoding utf8
  displayName: 'Create go.list file'
    
- task: SonatypeEvaluate@2
  inputs:
    nexusIqService: 'Lifecycle'
    applicationId: 'ef6260b689fc4646b3d3769154825426'
    stage: 'Build'
    scanTargets: '**/*.jar, **/*.war, **/*.ear, **/*.zip, **/*.tar.gz, **/go.sum, **/go.list, **/Gopkg.lock'
    resultFile: 'lifecycle-output'
    
